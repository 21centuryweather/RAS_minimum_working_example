meta=ancilOzone

[command]
default=rose mpi-launch -v central_ancillary.exe

[env]
IDAY_YEAR=10
IPACK=2
MASKIN=$ANCIL_TARGET_PATH/qrparm.mask
OZONEIN=$ROSE_DATA/etc/ancil_master_cap/ozone/shine_li/v1/qrclim.ozone
OZONEOUT=$ANCIL_TARGET_PATH/qrclim.ozone.unfix
P_LEVELS=$NLEVS
SEARCH_RADIUS=5
SEARCH_RADIUS_COL=-1
SEARCH_RADIUS_ROW=-1
SOUTHTONORTH=1
UNIT22=$ROSE_DATA/etc/ancil_STASHmaster
VERT_LEV=$VERT_LEV
VN=9.0

[file:LOGFILE]
mode=symlink
source=(fort.7)

[file:fort.4]
mode=symlink
source=namectrl.nl

[file:namectrl.nl]
source=$CAPGRID namelist:ancill namelist:ozone_li namelist:search $VERT_LEV $CAPHORIZGRID

[namelist:ancill]
aerosol=.false.
deepst=.false.
general=.false.
lsmask=.false.
orog=.false.
ozone=.true.
smcsnow=.false.
sstice=.false.
vegfrac=.false.

[namelist:ozone_li]
car_nozm=.false.
cariolle=.false.
limit_top=.false.
smooth=.true.
start_ozone_level=1
zonal_mean=.false.

[namelist:search]
zpole=55.0
ztropic=25.0
