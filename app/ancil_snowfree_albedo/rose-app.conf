[command]
default=ants-launch ancil_general_regrid.py --ants-config ${ANTS_CONFIG} \
       =${source} --target-lsm ${target_lsm} -o ${output}

[ants_regridding_horizontal]
scheme=Linear

[env]
ANTS_CONFIG=${PWD}/rose-app-run.conf
source=${ANCIL_MASTER}/land_clim/GlobAlbedo/v2/qrclim.land.nc
target_lsm=${ANCIL_TARGET_PATH}/${TARGET_LSM}
output=${ANCIL_TARGET_PATH}/qrclim.land

[ants_metadata]
history=${CYLC_SUITE_NAME}@${ROSE_SUITE_REVISION}:${ROSE_TASK_NAME}
