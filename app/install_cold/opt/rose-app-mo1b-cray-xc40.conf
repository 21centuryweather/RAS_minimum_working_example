[file:$ROSE_DATA/etc/um_STASHmaster]
mode=symlink
source=/projects/um1/vn${UM_VN}/ctldata/STASHmaster

[file:$ROSE_DATA/etc/ancil_STASHmaster]
mode=symlink
source=/projects/um1/vn${CAP_VN}/ctldata/STASHmaster

#
# This is the full path to the directory containing the L90 aerosol ancillaries.
#
[file:$ROSE_DATA/etc/ancil_master_aero_L90_cap]
mode=symlink
source=/data/d03/hadsw/RA2_AERO_ANCILS/aero_clims/GA6.0_antie/L90_40km_20YR/v2

# Source ancils CAP
[file:$ROSE_DATA/etc/ancil_master_cap]
mode=symlink
source=/projects/um1/ancil/atmos/master

[file:$ROSE_DATA/etc/ancil_parms]
mode=symlink
source=/projects/um1/ancil/data/parameters

[file:$ROSE_SUITE_DIR/share/fcm_make_cap]
mode=symlink
source=/projects/um1/vn${CAP_VN}/cray/ancil/build/v1.1/bin/

[file:$ROSE_SUITE_DIR/share/fcm_make_um_utils]
mode=symlink
source=/projects/um1/vn${UM_VN}/xc40/utilities

[file:$ROSE_SUITE_DIR/share/fcm_make_surf]
mode=symlink
source=~frsurf/cylc-run/SURF31.2.0/share/fcm_make_surf_xc40_haswell_ifort_opt

#
# This is the full path to the directory containing the netcdf ukca ancillary data for
# offline oxidants and emmissions. The standard setup uses CMIP5 emissions.
#
[file:$ROSE_DATA/etc/ancil_ukca_aero]
mode=symlink
source=/data/d05/frfp/hamgo_hadzm/ancils/n512e_mon_gcal/ncdf_ukca

[file:$ROSE_DATA/etc/ancil_ukca_glm1]
mode=symlink
source=/data/d05/frfp/hamgo_ancils/ukca-v10p3/n216e_mon_gcal/ncdf_ukca

[file:$ROSE_DATA/etc/ancil_ukca_glm2]
mode=symlink
source=/projects/um1/ancil/atmos/n216e/
