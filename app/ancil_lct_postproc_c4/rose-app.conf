[command]
default=ants-launch ancil_general_regrid.py --ants-config ${ANCIL_CONFIG} \
       =${c4source} --target-lsm ${target_lsm} --netcdf-only \
       =-o ${TMPDIR}/c4_percent_1d.nc &&\
       =
       =ants-launch ${CONTRIB_APPS}/LCT/ancil_lct_postproc_c4.py \
       = ${source} --islscpiic4 ${TMPDIR}/c4_percent_1d.nc -o ${output}

[ants_decomposition]
x_split=0
y_split=0

[ants_regridding_horizontal]
scheme=Linear

[env]
ANCIL_CONFIG=${PWD}/rose-app-run.conf
source=${ANCIL_TARGET_PATH}/${TARGET_VEGFRAC}_pre_c4.nc
target_lsm=${ANCIL_TARGET_PATH}/${TARGET_LSM}
output=${ANCIL_TARGET_PATH}/${TARGET_VEGFRAC}
c4source=${ANCIL_MASTER}/vegetation/cover/cci/v3/c4_percent_1d.nc

[ants_metadata]
history=${CYLC_SUITE_NAME}@${ROSE_SUITE_REVISION}:${ROSE_TASK_NAME}
