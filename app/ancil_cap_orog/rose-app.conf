meta=ancilOrog

[command]
default=rose mpi-launch -v central_ancillary.exe

[env]
!!DTEDASHIN=$ROSE_DATA/etc/ancil_master_cap/ash/DTED/v1/qrparm.ash
GLOBEASHIN=$ROSE_DATA/etc/ancil_master_cap/ash/GLOBE/v1/qrparm.ash
HALO_COL=10
HALO_ROW=11
IDAY_YEAR=10
IPACK=2
MASKIN=$ANCIL_TARGET_PATH/qrparm.mask
MASKOROG=DUMMY
NO_LAMBDA_BLOCKS=1
OROGIN=$ROSE_DATA/etc/ancil_master_cap/orography/GLOBE30/v1/qrparm.orog
OROGOUT=$ANCIL_TARGET_PATH/qrparm.orog
SEARCH_RADIUS=5
SEARCH_RADIUS_COL=-1
SEARCH_RADIUS_ROW=-1
SOUTHTONORTH=1
UNFILTERED_OROG=true
UNIT22=$ROSE_DATA/etc/ancil_STASHmaster
!!USERASHIN=
VALLEY_SMOOTHING=false
VERT_LEV=$VERT_LEV
VN=9.0

[file:LOGFILE]
mode=symlink
source=(fort.7)

[file:fort.4]
mode=symlink
source=namectrl.nl

[file:namectrl.nl]
source=$CAPGRID namelist:ancill namelist:orog namelist:search $VERT_LEV $CAPHORIZGRID

[namelist:ancill]
aerosol=.false.
deepst=.false.
general=.false.
lsmask=.false.
orog=.true.
ozone=.false.
smcsnow=.false.
sstice=.false.
vegfrac=.false.

[namelist:orog]
as_coef_srce=1,1,1.823310
epsilon=1.0
filt_srce_length=6000.0
!!filt_targ_lat=
!!filt_targ_ntimes=
l_auto_lakes=.true.
!!l_remove_neg_pt=.false.
l_sdfromnewmean=.true.
lfilt_srce_ew=.false.
lfilt_srce_iso=.false.
!!lfilt_srce_iso_mean=.false.
lfilt_srce_iso_sd=.true.
lfilt_targ_121=.false.
lfilt_targ_ew=.false.
lfilt_targ_raymond=.true.
lfilt_targ_subgrid=.true.
lz0_fillzero=.true.
!!min_lake_height=10
orog_mask_control=.true.
!!pancake_pole=0
remove_mean_grad=.true.
use_dted_ash=.false.
!!use_dted_ukonly=.false.
use_globe_ash=.true.
!!use_user_ash=.false.
!!user_dted_ash=.false.

[namelist:roi]
!!bl_lambda=0
!!bl_phi=0
!!tr_lambda=0
!!tr_phi=0

[namelist:search]
zpole=55.0
ztropic=25.0

[namelist:valley_smooth]
!!no_sweeps=0
