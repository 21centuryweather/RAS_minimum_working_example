meta=ancilSmcsnow

[command]
default=rose mpi-launch -v central_ancillary.exe

[env]
IDAY_YEAR=10
IPACK=2
MASKIN=$ANCIL_TARGET_PATH/qrparm.mask
SEARCH_RADIUS=5
SEARCH_RADIUS_COL=-1
SEARCH_RADIUS_ROW=20
SMCIN=$ROSE_DATA/etc/ancil_master_cap/soil_moisture/gswp2/hwsd_vg/v2/qrclim.smc
SMCSNOOUT=$ANCIL_TARGET_PATH/qrclim.smow
SNOWIN=$ROSE_DATA/etc/ancil_master_cap/snow/willmott_rowe/v1/qrclim.snow
SOILMOSES=$ANCIL_TARGET_PATH/qrparm.soil
SOUTHTONORTH=1
UNIT22=$ROSE_DATA/etc/ancil_STASHmaster
VERT_LEV=$VERT_LEV
VN=9.0

[file:LOGFILE]
mode=symlink
source=(fort.7)

[file:fort.4]
mode=symlink
source=namectrl.nl

[file:namectrl.nl]
source=$CAPGRID namelist:ancill namelist:smow namelist:search $VERT_LEV $CAPHORIZGRID

[namelist:ancill]
aerosol=.false.
deepst=.false.
general=.false.
lsmask=.false.
orog=.false.
ozone=.false.
smcsnow=.true.
sstice=.false.
vegfrac=.false.

[namelist:search]
zpole=55.0
ztropic=25.0

[namelist:smow]
max_snow=60000.0
