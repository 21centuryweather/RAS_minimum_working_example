[jinja2:suite.rc=rg02_rs03_levset]
ns=jinja2:suite.rc/rg02/rs03
sort-key=rg02_rs03-e
title=rg02_rs03_levset
description=Vertical levels set. Please see
           =the help panel for more details. 
help=Choose from one of the following vertical level sets
    =
    =1. L70_40km - 70 levels, 40 km lid. Used in the RA1-M mid-latitude 
    =              configuration, and in operational configurations, e.g. the UKV. 
    =
    =2. L80_38p5km   - 80 levels, 38.5 km lid. Used in the RA1-T tropical configuration
    =   and recommended for use in any km-scale tropical LAM. 
    =
    =3. L90_40km   - 90 levels, 40 km lid. Candidate RA2 configuration
    =   level set for use in both mid-latitude and tropical LAMs. 
    =   See https://code.metoffice.gov.uk/trac/rmed/wiki/ticket/36/TicketDetails for more details.
    =
    =10. L118_78km     - 118 levels, 78 km lid (UKV to 8km and then retains fine resolution
    =   through the stratosphere).
    =
    =11. L120_40km     - 120 levels, 40 km lid (Enhanced resolution = candidate levels set 
         for the future regional atmosphere model).   
    =
    =12. L140_40km - 140 levels, 40 km lid (Same levels as L70_40km but with twice the resolution) 
    =
    =15. L70_80km       - 70 levels, 80 km lid (used in the Met Office Global model)
    =
    =16. L85_85km       - 85 levels, 85 km lid (used in Met Office Global climate models)
    =
    =Other vertical level sets can be added upon request.
values="L70_40km","L80_38p5km","L90_40km","L118_78km","L120_40km","L140_40km","L70_80km","L85_85km"

[jinja2:suite.rc=rg02_rs03_min_lake_area]
ns=jinja2:suite.rc/rg02/rs03
sort-key=rg02_rs03-f
title=rg02_rs03_min_lake_area
description=NOT USED WHEN CCI_MASK is true 
           =Minimum area of lakes to retain in
           =LSM generation when using CAP/IGBP.
help=Inland lakes with an area (in square km) less than this will
    =be set to land points in the land-sea mask generated by the
    =regional ancillary suite.
    =
    =If the resulting land-sea mask excludes (includes) lakes that the
    =user wishes to be present (absent), then reduce (increase) the
    =value of this parameter and re-create the land-sea mask.
    =See http://collab.metoffice.gov.uk/twiki/bin/view/Support/ROSENestingSuiteLSMIssues#Namelist_Settings 
    = for more details.
type=real

[jinja2:suite.rc=rg02_rs03_mask_overrides]
ns=jinja2:suite.rc/rg02/rs03
sort-key=rg02_rs03-g1
title=rg02_rs03_mask_overrides
description=edit the land sea mask values after it  has been produced
           =PLEASE SEE HELP PANEL FOR FULL DETAILS
help=Ocasionally a user may want to manually specify whether some
    =specific grid points are land or sea.
    =
    =If this option is selected then either an image (.png) of the desired mask,
    =or a text file specifying the points to edit must be provided.
    =If a text  file is provided, then this textfile will be generated using mule-editmask genancil. 
    =Eitherway, it is anticipated that users will make use of the mule-editmask tool to assist with the editing. 
    =See ~frswa/test/mule_editmask/docs/index.html for instructions 
    =
    =Note this option is currently only available at the Met Office. Contact 
    =Simon Tucker (simon.tucker@metoffice.gov.uk) for more information 
    =
type=boolean
trigger=jinja2:suite.rc=rg02_rs03_mask_overrides_file: true;
fail-if=(this =='true') and not ((jinja2:suite.rc=SITE[1:-1] == 'mo1b-cray-xc40') or (jinja2:suite.rc=SITE[1:1] == 'mo1c-cray-xc40') or (jinja2:suite.rc=SITE[1:1] == 'moex-cray'));# Mask overrides currently only available at the Met Office.

[jinja2:suite.rc=rg02_rs03_mask_overrides_file]
ns=jinja2:suite.rc/rg02/rs03
sort-key=rg02_rs03-g2
title=rg02_rs03_mask_overrides_file
description=path to text or image file that specifies which points to edit
           =PLEASE SEE HELP PANEL FOR FULL DETAILS
help=Either a path to an image  (.png) of the desired mask,
    =or a text file specifying the points to edit must be provided.
    =If a text  file is provided, then this textfile will be generated using mule-editmask genancil. 
    =Eitherway, it is anticipated that users will make use of the mule-editmask tool to assist with the editing. 
    =See ~frswa/test/mule_editmask/docs/index.html for instructions
    =
type=quoted

[jinja2:suite.rc=rg02_rs03_alb_anc]
ns=jinja2:suite.rc/rg02/rs03
sort-key=rg02_rs03-h
title=rg02_rs03_alb_anc
description=Use albedo ancillary
help=This will produce an ancillary file for the SW albedo of the
    =snow-free land surface, using ~5 km resolution data from the
    =GlobAlbedo project.
    =
    =The ancillary is then used to adapt the land surface tiles in
    =the model, correcting the urban tile from being unrealistically
    =bright. This has been shown to cause an erroneous anti-heat
    =island effect in the Met Office 300 m London model.
type=boolean

[jinja2:suite.rc=rg02_rs03_orog_srtm]
ns=jinja2:suite.rc/rg02/rs03
sort-key=rg02_rs03-i1
title=rg02_rs03_orog_srtm
description=Use the 100m resolution SRTM dataset
           =to generate the mean orography.
           =PLEASE SEE HELP PANEL FOR FULL DETAILS.
help=Setting this to true will use the 100 m resolution Shuttle Radar Topography Mission (SRTM) data
    =to generate the mean orography. Note that the entire LAM domain must lie equatorwards of 
    =60N and 60S otherwise the ancillary file will not be made correctly. 
    = 
    =The code generates a set of ancillaries in the orog_srtm subdirectory. 
    = 
    =IF THIS SWITCH IS LEFT AS FALSE then the mean orography is generated from the 1 km resolution 
    =GLOBE dataset. In that case 
    =qrparm.orog.mn -> qrparm.orog
    = 
    =It will work in non-rotated, rotated or variable resolution grids.
trigger=jinja2:suite.rc=rg02_rs03_srtm_smooth: true;
type=boolean

[jinja2:suite.rc=rg02_rs03_srtm_smooth]
ns=jinja2:suite.rc/rg02/rs03
sort-key=rg02_rs03-i2
title=rg02_rs03_srtm_smooth
description=Method to smooth the SRTM-based
           =mean orography.
           =PLEASE SEE HELP PANEL FOR FULL DETAILS.
help=There are two options:
    =
    = 121: Applies the 1-2-1 smoothing filter 
    =      Each sweep of this smoothing is initially only applied at points >1500m ASL. 
    =      The 3rd to last sweep applies the smoothing at points >1000m ASL. 
    =      The penultimate sweep applies the smoothing at points >500m ASL. 
    =      The final sweep applies the 1-2-1 smoothing at all points. 
    =      To add more 121 iterations: include them in SMOOTH_FACTOR variable at L6 of  
    =      app/ancil_mean_orog_smooth/opt/rose-app-121.conf
    =      NOTE: This configuration is not recommended for variable resolution grids.
    = 
    = Raymond: Applies different values for the epsilon parameter of the Raymod filter 
    =          To add more epsilon values: in "epsilon" variable at L17 of 
    =          app/ancil_mean_orog_smooth/opt/rose-app-raymond.conf
    = 
    = The 121 filter is more effective at smoothing fields, but it may be inconsistent for
    = variable resolution grids, where the Raymond filter is prefered. 
    = 
    =THE AIM IS TO USE AS LITTLE SMOOTHING AS POSSIBLE. However, if there are 
    =BicGstab failures in the first few timesteps of a run, and investigations
    =reveal excessive near surface winds over steep slopes then it is recommended to test with 
    =progressively smoother ancillary files.
    =Testing the involves changing the soft link to orog_srtm subdirectory. 
    =Then on the RNS/ENS/RCS rerun the RCF job before retriggering the failing forecast job.
    =
    =For example for the 4.4 km WCSSP SE Asia domain method, the qrparm.orog.srtm.121x20 has been
    =found to be sufficient to smooth out both the slopes of the Himalayas and of New
    =Guinea to enable robustly stable real time forecasts to be run.
values="121","raymond"
value-titles="121","Raymond"
fail-if=(this[1:-1]=="121") and jinja2:suite.rc=rg02_rs03_vargrid[1:-1]=="variable";# 1-2-1 not availabe for variable grids

[jinja2:suite.rc=rg02_rs03_3D_ancils]
ns=jinja2:suite.rc/rg02/rs03
sort-key=rg02_rs03-j
title=rg02_rs03_3D_ancils
description=Use ozone and aerosol climatology ancillaries
           =REQUIRED FOR LFRIC
help=The default behaviour of the regional nesting suite is to reconfigure ozone and
    =aerosol climatology fields from the start dump of the parent model.
    =
    =Setting this to true will generate and use ancillary files for these 
    =3D fields instead. This is the recommended approach for free running 
    =simulations, in which these ancillaries are configured in each day.  
    = 
    =Beware that this can lead to large file sizes for high-resolution models.
    = 

type=boolean
trigger=jinja2:suite.rc=rg02_rs03_arcl_dust_anc: false;
fail-if=(this =='false') and jinja2:suite.rc=MAKE_LFRIC== 'true';

[jinja2:suite.rc=rg02_rs03_arcl_dust_anc]
ns=jinja2:suite.rc/rg02/rs03
sort-key=rg02_rs03-k
title=rg02_rs03_arcl_dust_anc
description=Use dust aerosol climatology ancillary
help=The RAS will produce an ancillary file for the dust
    =aerosol climatology by default. This is because the necessary
    =fields may be missing from the start dump of the parent model (as
    =an example, the Met Office global model has used the prognostic
    =dust scheme since July 2011 instead).
    =
    =However, if the necessary fields are present in the parent model
    =start dump, then they can be reconfigured by turning off this option.
    =This is particularly useful for very high-resolution nested models
    =since the dust aerosol climatology ancillary can be costly to produce.
type=boolean

[jinja2:suite.rc=rg02_rs03_sstsmc_anc]
ns=jinja2:suite.rc/rg02/rs03
sort-key=rg02_rs03-l
title=rg02_rs03_sstsmc_anc
description=Make extra SST and SMC ancillaries
           =REQUIRED FOR LFRIC
help=Select this option to generate the following extra ancillary files:
    =
    =1. Sea surface temperature and sea ice fraction (qrclim.sst and qrclim.seaice)
    =2. Soil moisture and snow amount (qrclim.smow)
    =
    =The soil moisture ancillary can only be made if land-use ancillaries are
    =being used.
    =
    =Note these extra ancillaries are not used by the default version of the nesting suite.
type=boolean
fail-if=(this =='false') and jinja2:suite.rc=MAKE_LFRIC== 'true';

[jinja2:suite.rc=rg02_rs03_moruses]
ns=jinja2:suite.rc/rg02/rs03
sort-key=rg02_rs03-m
title=rg02_rs03_moruses
description=Create ancillaries for MORUSES
help=The Met Office-Reading Urban Surface Exchange Scheme (MORUSES) 
    =Needs a 10-tiled vegetation file with urban roof and caynons 
    =and one ancillary file containing the prognostics of urban building height, 
    = urban height to width ratio (hwr) and urban width ratio (wrr). 
    =
    =This trigger will produce both files using the empirical relationships described in 
    =section 3 of S. Bohnenstengel et al. 2011, https://doi.org/10.1002/qj.855 
    =The qrparm.veg.frac.urb2t for 10-tiled vegetation fraction and 
    =qrparm.MORUSES.morph for MORUSES the urban parameters
type=boolean

# Region 03
[ns=jinja2:suite.rc/rg03]
title=Nested region 3 setup

[jinja2:suite.rc=rg03_name]
ns=jinja2:suite.rc/rg03
sort-key=rg03-a
title=rg03_name
description=Region name
type=quoted
fail-if="." in this; # Region name cannot contain a period

[jinja2:suite.rc=rg03_std_model]
ns=jinja2:suite.rc/rg03
sort-key=rg03-a2
title=rg03_std_model
description=EITHER a user specified grid (the original option), 
           =OR specify the path on the HPC to a predefined grid. 
           =SEE HELP PANEL FOR MORE DETAILS 
help=This option allows the user to choose between specifying the grid details 
    =within the GUI (as has always been the case), or to point the suite
    =at already existing (predefined) grid namelist(s).  
    =
    =The custom option allows the user to set up a domain by giving the number of
    =gridpoints, delta, bottom-left-corner or centre, in both this window
    =and the Resolution window.
    =
    =A predefined domain requires the location of the grid file(s) on the HPC to be specified 
    =in the Resolution window. See the help panels for those variables for more details. 
    =
    =
    =Instructions for generating variable resolution grid files can be found at 
    =https://code.metoffice.gov.uk/trac/rmed/wiki/suites/RAS/variablegrid 
    =
values="custom", "predefined"
value-titles=User specified, Predefined 
trigger=jinja2:suite.rc=rg03_use_centre: "custom" ;
        jinja2:suite.rc=rg03_rot_grid: "custom" ;
        jinja2:suite.rc=rg03_pole: "custom" ;
        jinja2:suite.rc=rg03_rs01_vargrid: "predefined" ;
        jinja2:suite.rc=rg03_rs01_delta: "custom" ;
        jinja2:suite.rc=rg03_rs01_npts: "custom" ;
        jinja2:suite.rc=rg03_rs01_blc: "custom" ;
        jinja2:suite.rc=rg03_rs01_offset: "custom" ;
        jinja2:suite.rc=rg03_rs01_grid_path: "predefined" ;
        jinja2:suite.rc=rg03_rs01_vargrid_path: "predefined" ;
        jinja2:suite.rc=rg03_rs02_vargrid: "predefined" ;
        jinja2:suite.rc=rg03_rs02_delta: "custom" ;
        jinja2:suite.rc=rg03_rs02_npts: "custom" ;
        jinja2:suite.rc=rg03_rs02_blc: "custom" ;
        jinja2:suite.rc=rg03_rs02_offset: "custom" ;
        jinja2:suite.rc=rg03_rs02_grid_path: "predefined" ;
        jinja2:suite.rc=rg03_rs02_vargrid_path: "predefined" ;
        jinja2:suite.rc=rg03_rs03_vargrid: "predefined" ;
        jinja2:suite.rc=rg03_rs03_delta: "custom" ;
        jinja2:suite.rc=rg03_rs03_npts: "custom" ;
        jinja2:suite.rc=rg03_rs03_blc: "custom" ;
        jinja2:suite.rc=rg03_rs03_offset: "custom" ;
        jinja2:suite.rc=rg03_rs03_grid_path: "predefined" ;
        jinja2:suite.rc=rg03_rs03_vargrid_path: "predefined" ;
fail-if=this[1:-1] != "custom"  and (jinja2:suite.rc=USE_ANTS =="false");# Predefined domains not available for CAP

[jinja2:suite.rc=rg03_use_centre]
ns=jinja2:suite.rc/rg03
sort-key=rg03-b
title=rg03_use_centre
description=Define the region/resolutions using the 
           =centre point (TRUE) or using the 
           =bottom left hand corner (FALSE) .
help=When use_centre is True, the grids will be defined relative to a 
    =common central point. This was the only choice up until July 2019. 
    = 
    =When it is False the bottom left corner of each resolution must 
    =be specified, e.g. as is/was the case when grids were generated using LAMPOS 
type=boolean
trigger=jinja2:suite.rc=rg03_centre: true;
        jinja2:suite.rc=rg03_pole: false ;
        jinja2:suite.rc=rg03_rs01_offset: true;
        jinja2:suite.rc=rg03_rs01_blc: false;
        jinja2:suite.rc=rg03_rs02_offset: true;
        jinja2:suite.rc=rg03_rs02_blc: false;
        jinja2:suite.rc=rg03_rs03_offset: true;
        jinja2:suite.rc=rg03_rs03_blc: false;

[jinja2:suite.rc=rg03_centre]
ns=jinja2:suite.rc/rg03
sort-key=rg03-c
title=rg03_centre
description=Coordinates of region centre
           =in degrees (lat, lon)
help=Coordinates can be specified either as integers or as real numbers      
    =e.g. 78.0 or 78.242 degrees, but not as 78. since the trailing .        
    =throws up a Jinja2 error at runtime.                                    
    =                                                                        
    =Longitude can be in -180 to 180 or.0 to 360 
type=real,real
fail-if=this(1) < -90.0; # Latitude cannot be less than -90
        this(1) > 90.0; # Latitude cannot exceed 90

[jinja2:suite.rc=rg03_rot_grid]
ns=jinja2:suite.rc/rg03
sort-key=rg03-d
title=rg03_rot_grid
description=Use rotated pole (true)
           =or true lat/lon grid (false).
           =When rg03_use_centre is True
           =rg03_centre will be used as the pole, otherwise
           =rg03_pole will be used.
type=boolean
trigger=jinja2:suite.rc=rg03_pole: true ;

[jinja2:suite.rc=rg03_pole]
ns=jinja2:suite.rc/rg03
sort-key=rg03-e
title=rg03_pole
description=The pole to use for this rotated region.
help=Coordinates can be specified either as integers or as real numbers      
    =e.g. 78.0 or 78.242 degrees, but not as 78. since the trailing .        
    =throws up a Jinja2 error at runtime.                                    
    =                                                                        
    =Longitude convection is 0 to 360 
type=real,real
fail-if=this(1) < -90.0; # Latitude cannot be less than -90
        this(1) > 90.0; # Latitude cannot exceed 90
        this(2) < 0.0; # Longitude cannot be less than 0
        this(2) > 360.0; # Longitude cannot exceed 360

[jinja2:suite.rc=rg03_igbp_offset]
ns=jinja2:suite.rc/rg03
sort-key=rg03-f
title=rg03_igbp_offset
description=NOT USED WHEN CCI_MASK is true 
           =(y,x) in kilometres IGBP land-sea mask offset
help=The IGBP dataset used by the Central Ancillary Program to create
    =the land-sea mask can be offset from truth by different distances in
    =different regions of the globe. This allows the user to offset the
    =land-sea mask generated to correct for this.
