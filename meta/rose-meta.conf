[jinja2:suite.rc=rg02_rs02_vargrid]
ns=jinja2:suite.rc/rg02/rs02
sort-key=rg02_rs02-c
title=rg02_rs02_vargrid
description=Fixed or Variable resolution domain
           =SEE HELP PANEL FOR MORE DETAILS 
