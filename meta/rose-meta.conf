    =gridlengths from 4.0km to 1.5km. Or fixed with a regular 
    =gridlength.
    =
    =Currently this option is only available for predefined domains 
    =via 'vargrid_path' variable. Ticket #176 at  
    =https://code.metoffice.gov.uk/trac/rmed/ticket/176 
    =will provide functionality to produce user-defined variable resolution 
    =domains 
    =
values="fixed", "variable"
trigger=jinja2:suite.rc=rg02_rs02_vargrid_path: "variable";

[jinja2:suite.rc=rg02_rs02_grid_path]
ns=jinja2:suite.rc/rg02/rs02
sort-key=rg02_rs02-d1
title=rg02_rs02_grid_path
description=Full HPC path to the horizontal grid file. 
           =SEE HELP PANEL FOR MORE DETAILS 
help=This is the location on your HPC of the file defining the horizontal 
    =grid dimensions and rotated pole (&GRID UM resolution). Additionally for 
    =a fixed resolution model it defines the grid spacing.   
    =
    =eg. the relevant UKV file on the Met Office system is located at 
    =/projects/um1/ancil/data/namelist/grids/grid.ukv_new/v1/grid.ukv_new 
    =
    =The file can equally be a user's grid.nl file, e.g. generated by a previous 
    =run of this suite.
type=quoted

[jinja2:suite.rc=rg02_rs02_vargrid_path]
ns=jinja2:suite.rc/rg02/rs02
sort-key=rg02_rs02-d2
title=rg02_rs02_vargrid_path
description=Full HPC path to the variable resolution 
           =grid namelist file. 
           =SEE HELP PANEL FOR MORE DETAILS 
help=This is the location on your HPC of the file defining the latitudes and 
    =longitudes of your variable resolution grid (&HORIZGRID UM namelist). 
    =
    =eg. the relevant UKV file on the Met Office system is located at 
    =/projects/um1/ancil/data/namelist/variable_grids/variable.ukv_new/v1/variable.ukv_new
    =
    =The file can equally be one specified by a user if they have generated 
    =their own variable resolution grid namelist.
type=quoted

[jinja2:suite.rc=rg02_rs02_blc]
ns=jinja2:suite.rc/rg02/rs02
sort-key=rg02_rs02-d1
title=rg02_rs02_blc
description=Bottom Left corner (lat, lon) of ENDGame domain [Lon: 0-360]
help=The bottom left corner of the domian. If the domain
    =is rotated then this must be given in the
    =rotated coordinates. Note that this is the ENDGame grid
    =and is therefore offset by half a grid spacing from the
    =corner calculated from the centre and the grid size,
    =where centre refers to the centre given when
    =rg02_use_centre is true.
type=real,real
fail-if=this(1) < -90.0; # Latitude cannot be less than -90
        this(1) > 90.0; # Latitude cannot exceed 90
        this(2) < 0.0; # Longitude cannot be less than 0
        this(2) > 360.0; # Longitude cannot exceed 360

[jinja2:suite.rc=rg02_rs02_delta]
ns=jinja2:suite.rc/rg02/rs02
sort-key=rg02_rs02-d2
title=rg02_rs02_delta
