
[jinja2:suite.rc]
ns=jinja2:suite.rc
title=Regional Ancillary Suite
url=https://code.metoffice.gov.uk/trac/rmed/wiki/suites/RAS

# General run options
[ns=jinja2:suite.rc/run]
sort-key=sec-a
title=General run options

[jinja2:suite.rc=SITE]
ns=jinja2:suite.rc/run
sort-key=run-a
title=SITE
description=Select site where the nesting
           =suite will be run
compulsory=true
values="site","mo1b-cray-xc40","mo1c-cray-xc40","nci-gadi","mss-utama","niwa-cray-cs500", "moex-cray"
value-titles=Please select,Met Office xce/xcf,Met Office   xcs ,NCI Gadi, MSS Utama, NIWA Maui-ancil, Met Office ex
trigger=jinja2:suite.rc=CHARGING_CODE: "mo1b-cray-xc40","mo1c-cray-xc40";
        jinja2:suite.rc=ARCHIVE_ANCILS: "mo1b-cray-xc40","mo1c-cray-xc40","moex-cray";
        jinja2:suite.rc=USE_UKCA: "mo1b-cray-xc40","mo1c-cray-xc40","nci-gadi","mss-utama","moex-cray";
        jinja2:suite.rc=HOST_EX: "moex-cray";
        jinja2:suite.rc=NCI_PROJECT: "nci-gadi";
        jinja2:suite.rc=NCI_STORAGE: "nci-gadi";
        jinja2:suite.rc=NCI_QUEUE: "nci-gadi";
        jinja2:suite.rc=MSS_PROJECT: "mss-utama";
        jinja2:suite.rc=MSS_QUEUE: "mss-utama";

[jinja2:suite.rc=HOST_EX]
ns=jinja2:suite.rc/run
sort-key=run-a1
title=EX HOST
description=Select quadrant on EX where the nesting
           =suite will be run
compulsory=true
values="exab","excd"
value-titles=EXA and EXB,EXC and EXD

[jinja2:suite.rc=CHARGING_CODE]
ns=jinja2:suite.rc/run
sort-key=run-c
title=CHARGING_CODE
description=Set accounting code HPC usage will be charged
           =against. Currently only activated for
           =Met Office XC40.
help=For Met Office users this needs to be "climate", "foundation" or "weather"
type=quoted

[ns=jinja2:suite.rc/nci]
title=NCI site options
sort-key=sec-a-1

[jinja2:suite.rc=NCI_PROJECT]
ns=jinja2:suite.rc/nci
sort-key=nci-1
type=quoted
compulsory=true
description=NCI Project code (leave blank for default project)

[jinja2:suite.rc=NCI_STORAGE]
ns=jinja2:suite.rc/nci
sort-key=nci-2
type=quoted
compulsory=true
description=Extra storage mounts (e.g. "gdata/a12+scratch/cd3")
           =Additionally gdata/access will always be added

[jinja2:suite.rc=NCI_QUEUE]
ns=jinja2:suite.rc/nci
sort-key=nci-3
value-hints="background","normal","express"
type=quoted
compulsory=true
description=PBS queue to use (or "background" to run on the login node)

[ns=jinja2:suite.rc/ccrs]
title=CCRS site options
sort-key=sec-a-1

[jinja2:suite.rc=MSS_PROJECT]
ns=jinja2:suite.rc/ccrs
sort-key=ccrs-1
type=quoted
compulsory=true
description=...

[jinja2:suite.rc=MSS_QUEUE]
ns=jinja2:suite.rc/ccrs
sort-key=ccrs-2
value-hints="background","normal","express"
type=quoted
compulsory=true
description=...
[jinja2:suite.rc=MAKE_LFRIC]
ns=jinja2:suite.rc/run
sort-key=run-d
title=MAKE_LFRIC
description=Convert ancillaries to LFRIC
compulsory=true
help=This switch activates the tasks to reformat several UM ancillaries
    =to the UGRID format, so they can be ingested by LFRIC-LAMs.
    =
    =The ancillaries reformatted are those included in the 'ancils_2_ugrid' 
    =dictionary at the end of the 'suite-setup.rc' file, see comment above the 
    =dictionary declaration for a description of each entries.
    =
    =The conversion is done by the 'ancil_remap_ugrid' task using 
    =a bespoke python script. Future work will replace it 
    =by the UG-ANTS package.
    =
    =There is an exception with aerosol climatologies, LFRIC uses GLOMAPS and 
    =the um ancil at $ANCIL_DIR/aerosol_clims/glomap/qrclim.aerosols.nc is created to 
    =produce the LFRIC ancillary, but it is ignored by the UM as it is not part of 
    =RAL3 or older configurations.
type=boolean

[jinja2:suite.rc=ARCHIVE_ANCILS]
ns=jinja2:suite.rc/run
sort-key=run-o
title=ARCHIVE_ANCILS
description=Archive ancils to MASS?
help=Files normally get archived to 
    =moose:/adhoc/users/[USER_ID]/ancils/[SUITE_NAME]_[REGION]_[RESOLUTION] 
    =however it is possible to specify a different location by
    =changing the MASSROOTDIR variable in the archive app. 
    =
    =Everything written to ANCIL_TARGET_PATH ($ROSE_DATA/ancils/[REGION]/[RESOLUTION) 
    =gets archived. This includes the orog_srtm sub directory, and all the text  
    =files which get put in to a tarball (called text_files.tar) that will need 
    =to get extracted following retrieval from MASS. 
type=boolean

[jinja2:suite.rc=USE_ANTS]
ns=jinja2:suite.rc/run
sort-key=run-g
title=USE_ANTS
compulsory=true
description=Use ANTS to build ancillaries instead of CAP
           =SEE THE HELP PANEL FOR MORE DETAILS. 
help=If true, several ancillaries are built using the ANcillary Tools and Suites (ANTS) 
    =instead of being built by the Central Ancillary Program (CAP).
    =
    =Ancillaries built by ANTS: 
    =- Vegetation fraction from the 300m ANTS CCI land use dataset. 
    =- Vegetation function 
    =- Soil albedo 
    =- Topographic Index 
    =- Chlorophyll climate albedo  
    =- Snow free albedo if rgXX_rsYY_land is True
    =- Climatological aerosols including dust if rgXX_rsYY_3D_ancils is True
    =- Dust only if rgXX_rsYY_3D_ancils is False and rgXX_rsYY_arcl_dust_anc is True
    =
    =The source of the Land Sea mask is chosen by the setting for the CCI_MASK below 
    =
type=boolean
trigger=jinja2:suite.rc=CCI_MASK: true;

[jinja2:suite.rc=CCI_MASK]
ns=jinja2:suite.rc/run
sort-key=run-h
title=CCI_MASK
compulsory=true
description=Specifies which land sea mask to use. 
           =Set to true for CCI and to false for IGBP. 
           =SEE THE HELP PANEL FOR MORE DETAILS. 
help=Specifies whether or not to use the 300m ANTS CCI land use dataset 
    =in generating the land-sea mask.
    =
    =If this switch is set to true then both the land sea mask and the 
    = vegetation fraction ancillaries are generated from the CCI dataset. 
    =
    =If this switch is set to false then the land sea mask is generated from 
    =the IGBP dataset whilst the vegetation fraction ancillary is generated  
    =from the CCI dataset. 
    =
type=boolean

[jinja2:suite.rc=WC_URBAN]
ns=jinja2:suite.rc/run
sort-key=run-h
title=WC_URBAN
compulsory=true
description=If true, the urban fraction in the land cover 
           =ancillary is replaced with ESA WorldCover 
           =urban fraction. 
           =NOTE: not compatible with CCI_MASK = False. 
           =SEE THE HELP PANEL FOR MORE DETAILS. 
help=Specifies whether to use ESA WorldCover 2021 v200 to replace urban 
    =fractions.
    =
    =WorldCover is a 10 m global land cover dataset that provides higher resolution 
    =urban land cover classification than CCI which is a 300 m global land cover 
    =dataset. 
    =
    =For efficiency, the source dataset contains pre-processed WorldCover with 100 m 
    =urban fraction. 
    =
    =In ancil_lct_postproc_wc_urban app there is the option to specify a non-urban 
    =sub-grid fraction, which can be used to account for vegetation that is sub-grid  
    =(e.g., trees and small gardens which are <10 m). 
    =
    =WC_URBAN is not compatible with CCI_MASK = False. KGO tests revealed that there 
    =are differences in the latitudes and longitudes between the IGBP mask and land  
    =cover cube which causes ants.analysis.make_consistent_with_lsm to fail. 
    =
type=boolean

[jinja2:suite.rc=USE_UKCA]
ns=jinja2:suite.rc/run
sort-key=run-m
title=USE_UKCA
description=Produce UKCA ancillaries for NS.
           =See the help panel for more details
help=Creates the following ancillaries for UKCA: 
    =- cap_mask_nolakes 
    =- cap_sulpdms 
    =- cap_chloro 
    =- ukca_s 
    =- ukca_c 
    =- ukca_ox 
    =
    =NOTE cap_mask_nolakes needs to be replaced. Currently it won't work as igbp_offset !=0 
    =
    =NOTE: ukca_s,ukca_c and ukca_ox are built from the python 2.7
    =script app/ancil_ukca/bin/regrid_ancil_ct.py; future work will 
    = aim to use ANTS to produce these 
    =
    =NOTE: if USE_UKCA and UKCA_FROM_ANTS then the ANTS general regridding
    =script with linear interpolation will be used rather than the python
    =regridding script inset at app/ancil_ukca
compulsory=true
type=boolean
trigger=jinja2:suite.rc=UKCA_FROM_ANTS: true;
fail-if=(this =='true') and jinja2:suite.rc=rg01_rs01_3D_ancils == 'false';
       =(this =='true') and jinja2:suite.rc=rg01_rs02_3D_ancils == 'false';
       =(this =='true') and jinja2:suite.rc=rg01_rs03_3D_ancils == 'false';
       =(this =='true') and jinja2:suite.rc=rg02_rs01_3D_ancils == 'false';
       =(this =='true') and jinja2:suite.rc=rg02_rs02_3D_ancils == 'false';
       =(this =='true') and jinja2:suite.rc=rg02_rs03_3D_ancils == 'false';
       =(this =='true') and jinja2:suite.rc=rg03_rs01_3D_ancils == 'false';
       =(this =='true') and jinja2:suite.rc=rg03_rs02_3D_ancils == 'false';
       =(this =='true') and jinja2:suite.rc=rg03_rs03_3D_ancils == 'false';

[jinja2:suite.rc=UKCA_FROM_ANTS]
ns=jinja2:suite.rc/run
sort-key=run-n
title=UKCA_FROM_ANTS
compulsory=true
description=Produce UKCA ancillaries using ANTS scripts
help=If UKCA_FROM_ANTS=true then the ANTS general regridding script
    =with linear interpolation will be used rather than the python
    =regridding script inset
compulsory=true
type=boolean
fail-if=(this =='true') and jinja2:suite.rc=USE_UKCA == 'false';# UKCA_FROM_ANTS requires UKCA on
       =(this =='true') and jinja2:suite.rc=USE_ANTS == 'false';# UKCA_FROM_ANTS requires ANTS on

[jinja2:suite.rc=KGO_TEST]
ns=jinja2:suite.rc/run
sort-key=run-p
compulsory = true
title = KGO test
description = Test output against Known Good Output 
help =This option will run a specific predefined-test 
     =(defined in this panel as [KGO_TEST_NAME]), and compare 
     =its output with a centralized Known Good Output (KGO) 
     =located in the KGO_DIR directory specified in 
     =site/[SITE]/suite-adds.rc
     =
     =The [KGO_TEST_NAME] is defined in the file 
     =opt/rose-suite-[KGO_TEST_NAME].conf, which will 
     =be appended to the rose-suite.conf. Therefore
     =the latter needs to be on its 'vainila' verison to run the test. 
     =To revert the rose-suite.conf file to the 'vainila' 
     =verison, run './setup_metadata 3 3' at bin/ 
     =
     =The value of this KGO_TEST variable will be overwritten by 
     =opt/rose-suite-[KGO_TEST_NAME].conf, so please leave it 
     =always set as False in the rose-suite.conf
     =
     =List of available test in the RAS can be found in 
     =https://code.metoffice.gov.uk/trac/rmed/wiki/dev/practices/KGOs#RAS
     =
     =TO RUN the [KGO_TEST_NAME] KGO_TEST, execute the following command 
     =at the suite home directory: 
     =
     ='rose suite-run -O [KGO_TEST_NAME]' 
     =
     = Please contact the RAS owner for further clarifications
     =
type=boolean

[jinja2:suite.rc=nregns]
ns=jinja2:suite.rc/run
sort-key=run-l
title=nregns
description=Number of nested regions
help=Number of geographical regions to nest.
    =
    =As it is likely that most users will only need one geographical region,
    =the GUI and metadata are by default set up to have a maximum of 3 region and 
    =a maximum of 3 resolutions (per region) 
    =
    =To change any of these defaults, go into the bin directory and type 
    ='./setup_metadata 3 3' replacing any of the numbers with your preference. 
    =Note that you will then have to work through the GUI afresh as a new 
    =rose-suite.conf is generated by this command. 
    =
type=integer
range=1:3
trigger=jinja2:suite.rc=rg01_name: this >= 1;
        jinja2:suite.rc=rg01_std_model: this >= 1;
        jinja2:suite.rc=rg01_use_centre: this >= 1;
        jinja2:suite.rc=rg01_centre: this >= 1;
        jinja2:suite.rc=rg01_rot_grid: this >= 1;
        jinja2:suite.rc=rg01_igbp_offset: this >= 1;
        jinja2:suite.rc=rg01_nreslns: this >= 1;
        jinja2:suite.rc=rg02_name: this >= 2;
        jinja2:suite.rc=rg02_std_model: this >= 2;
        jinja2:suite.rc=rg02_use_centre: this >= 2;
        jinja2:suite.rc=rg02_centre: this >= 2;
        jinja2:suite.rc=rg02_rot_grid: this >= 2;
        jinja2:suite.rc=rg02_igbp_offset: this >= 2;
        jinja2:suite.rc=rg02_nreslns: this >= 2;
        jinja2:suite.rc=rg03_name: this >= 3;
        jinja2:suite.rc=rg03_std_model: this >= 3;
        jinja2:suite.rc=rg03_use_centre: this >= 3;
        jinja2:suite.rc=rg03_centre: this >= 3;
        jinja2:suite.rc=rg03_rot_grid: this >= 3;
        jinja2:suite.rc=rg03_igbp_offset: this >= 3;
        jinja2:suite.rc=rg03_nreslns: this >= 3;

# Region 01
[ns=jinja2:suite.rc/rg01]
title=Nested region 1 setup

[jinja2:suite.rc=rg01_name]
ns=jinja2:suite.rc/rg01
sort-key=rg01-a
title=rg01_name
description=Region name
type=quoted
fail-if="." in this; # Region name cannot contain a period

[jinja2:suite.rc=rg01_std_model]
ns=jinja2:suite.rc/rg01
sort-key=rg01-a2
title=rg01_std_model
description=EITHER a user specified grid (the original option), 
           =OR specify the path on the HPC to a predefined grid. 
           =SEE HELP PANEL FOR MORE DETAILS 
help=This option allows the user to choose between specifying the grid details 
    =within the GUI (as has always been the case), or to point the suite
    =at already existing (predefined) grid namelist(s).  
    =
    =The custom option allows the user to set up a domain by giving the number of
    =gridpoints, delta, bottom-left-corner or centre, in both this window
    =and the Resolution window.
    =
    =A predefined domain requires the location of the grid file(s) on the HPC to be specified 
    =in the Resolution window. See the help panels for those variables for more details. 
    =
    =
    =Instructions for generating variable resolution grid files can be found at 
    =https://code.metoffice.gov.uk/trac/rmed/wiki/suites/RAS/variablegrid 
    =
values="custom", "predefined"
value-titles=User specified, Predefined 
trigger=jinja2:suite.rc=rg01_use_centre: "custom" ;
        jinja2:suite.rc=rg01_rot_grid: "custom" ;
        jinja2:suite.rc=rg01_pole: "custom" ;
        jinja2:suite.rc=rg01_rs01_vargrid: "predefined" ;
        jinja2:suite.rc=rg01_rs01_delta: "custom" ;
        jinja2:suite.rc=rg01_rs01_npts: "custom" ;
        jinja2:suite.rc=rg01_rs01_blc: "custom" ;
        jinja2:suite.rc=rg01_rs01_offset: "custom" ;
        jinja2:suite.rc=rg01_rs01_grid_path: "predefined" ;
        jinja2:suite.rc=rg01_rs01_vargrid_path: "predefined" ;
        jinja2:suite.rc=rg01_rs02_vargrid: "predefined" ;
        jinja2:suite.rc=rg01_rs02_delta: "custom" ;
        jinja2:suite.rc=rg01_rs02_npts: "custom" ;
        jinja2:suite.rc=rg01_rs02_blc: "custom" ;
        jinja2:suite.rc=rg01_rs02_offset: "custom" ;
        jinja2:suite.rc=rg01_rs02_grid_path: "predefined" ;
        jinja2:suite.rc=rg01_rs02_vargrid_path: "predefined" ;
        jinja2:suite.rc=rg01_rs03_vargrid: "predefined" ;
        jinja2:suite.rc=rg01_rs03_delta: "custom" ;
        jinja2:suite.rc=rg01_rs03_npts: "custom" ;
        jinja2:suite.rc=rg01_rs03_blc: "custom" ;
        jinja2:suite.rc=rg01_rs03_offset: "custom" ;
        jinja2:suite.rc=rg01_rs03_grid_path: "predefined" ;
        jinja2:suite.rc=rg01_rs03_vargrid_path: "predefined" ;
fail-if=this[1:-1] != "custom"  and (jinja2:suite.rc=USE_ANTS =="false");# Predefined domains not available for CAP

[jinja2:suite.rc=rg01_use_centre]
ns=jinja2:suite.rc/rg01
sort-key=rg01-b
title=rg01_use_centre
description=Define the region/resolutions using the 
           =centre point (TRUE) or using the 
           =bottom left hand corner (FALSE) .
help=When use_centre is True, the grids will be defined relative to a 
    =common central point. This was the only choice up until July 2019. 
    = 
    =When it is False the bottom left corner of each resolution must 
    =be specified, e.g. as is/was the case when grids were generated using LAMPOS 
type=boolean
trigger=jinja2:suite.rc=rg01_centre: true;
        jinja2:suite.rc=rg01_pole: false ;
        jinja2:suite.rc=rg01_rs01_offset: true;
        jinja2:suite.rc=rg01_rs01_blc: false;
        jinja2:suite.rc=rg01_rs02_offset: true;
        jinja2:suite.rc=rg01_rs02_blc: false;
        jinja2:suite.rc=rg01_rs03_offset: true;
        jinja2:suite.rc=rg01_rs03_blc: false;

[jinja2:suite.rc=rg01_centre]
ns=jinja2:suite.rc/rg01
sort-key=rg01-c
title=rg01_centre
description=Coordinates of region centre
           =in degrees (lat, lon)
help=Coordinates can be specified either as integers or as real numbers      
    =e.g. 78.0 or 78.242 degrees, but not as 78. since the trailing .        
    =throws up a Jinja2 error at runtime.                                    
    =                                                                        
    =Longitude can be in -180 to 180 or.0 to 360 
type=real,real
fail-if=this(1) < -90.0; # Latitude cannot be less than -90
        this(1) > 90.0; # Latitude cannot exceed 90

[jinja2:suite.rc=rg01_rot_grid]
ns=jinja2:suite.rc/rg01
sort-key=rg01-d
title=rg01_rot_grid
description=Use rotated pole (true)
           =or true lat/lon grid (false).
           =When rg01_use_centre is True
           =rg01_centre will be used as the pole, otherwise
           =rg01_pole will be used.
type=boolean
trigger=jinja2:suite.rc=rg01_pole: true ;

[jinja2:suite.rc=rg01_pole]
ns=jinja2:suite.rc/rg01
sort-key=rg01-e
title=rg01_pole
description=The pole to use for this rotated region.
help=Coordinates can be specified either as integers or as real numbers      
    =e.g. 78.0 or 78.242 degrees, but not as 78. since the trailing .        
    =throws up a Jinja2 error at runtime.                                    
    =                                                                        
    =Longitude convection is 0 to 360 
type=real,real
fail-if=this(1) < -90.0; # Latitude cannot be less than -90
        this(1) > 90.0; # Latitude cannot exceed 90
        this(2) < 0.0; # Longitude cannot be less than 0
        this(2) > 360.0; # Longitude cannot exceed 360

[jinja2:suite.rc=rg01_igbp_offset]
ns=jinja2:suite.rc/rg01
sort-key=rg01-f
title=rg01_igbp_offset
description=NOT USED WHEN CCI_MASK is true 
           =(y,x) in kilometres IGBP land-sea mask offset
help=The IGBP dataset used by the Central Ancillary Program to create
    =the land-sea mask can be offset from truth by different distances in
    =different regions of the globe. This allows the user to offset the
    =land-sea mask generated to correct for this.
type=real,real

[jinja2:suite.rc=rg01_nreslns]
ns=jinja2:suite.rc/rg01
sort-key=rg01-g
title=rg01_nreslns
description=Number of resolutions
help=This defines the number of nested model resolutions for this region.
    =As it is likely that most users will only need a maximum of 3 resolutions,,
    =the GUI and metadata are by default set up to have a maximum of 3 regions, 
    =a maximum of 3 resolutions (per region)
    =
    =To change any of these defaults, go into the bin directory and type 
    ='./setup_metadata 3 3' replacing any of the numbers with your preference. 
    =Note that you will then have to work through the GUI afresh as a new 
    =rose-suite.conf is generated by this command. 
    =
type=integer
range=1:3
trigger=jinja2:suite.rc=rg01_rs01_name: this >= 1;
        jinja2:suite.rc=rg01_rs01_vargrid: this >= 1;
        jinja2:suite.rc=rg01_rs01_blc: this >= 1;
        jinja2:suite.rc=rg01_rs01_3D_ancils: this >= 1;
        jinja2:suite.rc=rg01_rs01_arcl_dust_anc: this >= 1;
        jinja2:suite.rc=rg01_rs01_sstsmc_anc: this >= 1;
        jinja2:suite.rc=rg01_rs01_min_lake_area: this >= 1;
        jinja2:suite.rc=rg01_rs01_mask_overrides: this >= 1;
        jinja2:suite.rc=rg01_rs01_mask_overrides_file: this >= 1;
        jinja2:suite.rc=rg01_rs01_alb_anc: this >= 1;
        jinja2:suite.rc=rg01_rs01_moruses: this >= 1;
        jinja2:suite.rc=rg01_rs01_orog_srtm: this >= 1;
        jinja2:suite.rc=rg01_rs01_srtm_smooth: this >= 1;
        jinja2:suite.rc=rg01_rs01_npts: this >= 1;
        jinja2:suite.rc=rg01_rs01_delta: this >= 1;
        jinja2:suite.rc=rg01_rs01_levset: this >= 1;
        jinja2:suite.rc=rg01_rs01_offset: this >= 1;
        jinja2:suite.rc=rg01_rs01_grid_path: this >= 1;
        jinja2:suite.rc=rg01_rs01_vargrid_path: this >= 1;
        jinja2:suite.rc=rg01_rs02_name: this >= 2;
        jinja2:suite.rc=rg01_rs02_vargrid: this >= 2;
        jinja2:suite.rc=rg01_rs02_blc: this >= 2;
        jinja2:suite.rc=rg01_rs02_3D_ancils: this >= 2;
        jinja2:suite.rc=rg01_rs02_arcl_dust_anc: this >= 2;
        jinja2:suite.rc=rg01_rs02_sstsmc_anc: this >= 2;
        jinja2:suite.rc=rg01_rs02_min_lake_area: this >= 2;
        jinja2:suite.rc=rg01_rs02_mask_overrides: this >= 2;
        jinja2:suite.rc=rg01_rs02_mask_overrides_file: this >= 2;
        jinja2:suite.rc=rg01_rs02_alb_anc: this >= 2;
        jinja2:suite.rc=rg01_rs02_moruses: this >= 2;
        jinja2:suite.rc=rg01_rs02_orog_srtm: this >= 2;
        jinja2:suite.rc=rg01_rs02_srtm_smooth: this >= 2;
        jinja2:suite.rc=rg01_rs02_npts: this >= 2;
        jinja2:suite.rc=rg01_rs02_delta: this >= 2;
        jinja2:suite.rc=rg01_rs02_levset: this >= 2;
        jinja2:suite.rc=rg01_rs02_offset: this >= 2;
        jinja2:suite.rc=rg01_rs02_grid_path: this >= 2;
        jinja2:suite.rc=rg01_rs02_vargrid_path: this >= 2;
        jinja2:suite.rc=rg01_rs03_name: this >= 3;
        jinja2:suite.rc=rg01_rs03_vargrid: this >= 3;
        jinja2:suite.rc=rg01_rs03_blc: this >= 3;
