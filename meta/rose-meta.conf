    =Needs a 10-tiled vegetation file with urban roof and caynons 
    =and one ancillary file containing the prognostics of urban building height, 
    = urban height to width ratio (hwr) and urban width ratio (wrr). 
    =
    =This trigger will produce both files using the empirical relationships described in 
    =section 3 of S. Bohnenstengel et al. 2011, https://doi.org/10.1002/qj.855 
    =The qrparm.veg.frac.urb2t for 10-tiled vegetation fraction and 
    =qrparm.MORUSES.morph for MORUSES the urban parameters
type=boolean

# Region 02
[ns=jinja2:suite.rc/rg02]
title=Nested region 2 setup

[jinja2:suite.rc=rg02_name]
ns=jinja2:suite.rc/rg02
sort-key=rg02-a
title=rg02_name
description=Region name
type=quoted
fail-if="." in this; # Region name cannot contain a period

[jinja2:suite.rc=rg02_std_model]
ns=jinja2:suite.rc/rg02
sort-key=rg02-a2
title=rg02_std_model
description=EITHER a user specified grid (the original option), 
           =OR specify the path on the HPC to a predefined grid. 
           =SEE HELP PANEL FOR MORE DETAILS 
help=This option allows the user to choose between specifying the grid details 
    =within the GUI (as has always been the case), or to point the suite
    =at already existing (predefined) grid namelist(s).  
    =
    =The custom option allows the user to set up a domain by giving the number of
    =gridpoints, delta, bottom-left-corner or centre, in both this window
    =and the Resolution window.
    =
    =A predefined domain requires the location of the grid file(s) on the HPC to be specified 
    =in the Resolution window. See the help panels for those variables for more details. 
    =
    =
    =Instructions for generating variable resolution grid files can be found at 
    =https://code.metoffice.gov.uk/trac/rmed/wiki/suites/RAS/variablegrid 
    =
values="custom", "predefined"
value-titles=User specified, Predefined 
trigger=jinja2:suite.rc=rg02_use_centre: "custom" ;
        jinja2:suite.rc=rg02_rot_grid: "custom" ;
        jinja2:suite.rc=rg02_pole: "custom" ;
        jinja2:suite.rc=rg02_rs01_vargrid: "predefined" ;
        jinja2:suite.rc=rg02_rs01_delta: "custom" ;
        jinja2:suite.rc=rg02_rs01_npts: "custom" ;
        jinja2:suite.rc=rg02_rs01_blc: "custom" ;
        jinja2:suite.rc=rg02_rs01_offset: "custom" ;
        jinja2:suite.rc=rg02_rs01_grid_path: "predefined" ;
        jinja2:suite.rc=rg02_rs01_vargrid_path: "predefined" ;
        jinja2:suite.rc=rg02_rs02_vargrid: "predefined" ;
        jinja2:suite.rc=rg02_rs02_delta: "custom" ;
        jinja2:suite.rc=rg02_rs02_npts: "custom" ;
        jinja2:suite.rc=rg02_rs02_blc: "custom" ;
        jinja2:suite.rc=rg02_rs02_offset: "custom" ;
        jinja2:suite.rc=rg02_rs02_grid_path: "predefined" ;
        jinja2:suite.rc=rg02_rs02_vargrid_path: "predefined" ;
        jinja2:suite.rc=rg02_rs03_vargrid: "predefined" ;
        jinja2:suite.rc=rg02_rs03_delta: "custom" ;
        jinja2:suite.rc=rg02_rs03_npts: "custom" ;
        jinja2:suite.rc=rg02_rs03_blc: "custom" ;
        jinja2:suite.rc=rg02_rs03_offset: "custom" ;
        jinja2:suite.rc=rg02_rs03_grid_path: "predefined" ;
        jinja2:suite.rc=rg02_rs03_vargrid_path: "predefined" ;
fail-if=this[1:-1] != "custom"  and (jinja2:suite.rc=USE_ANTS =="false");# Predefined domains not available for CAP

[jinja2:suite.rc=rg02_use_centre]
ns=jinja2:suite.rc/rg02
sort-key=rg02-b
title=rg02_use_centre
description=Define the region/resolutions using the 
           =centre point (TRUE) or using the 
           =bottom left hand corner (FALSE) .
help=When use_centre is True, the grids will be defined relative to a 
    =common central point. This was the only choice up until July 2019. 
    = 
    =When it is False the bottom left corner of each resolution must 
    =be specified, e.g. as is/was the case when grids were generated using LAMPOS 
type=boolean
trigger=jinja2:suite.rc=rg02_centre: true;
        jinja2:suite.rc=rg02_pole: false ;
        jinja2:suite.rc=rg02_rs01_offset: true;
        jinja2:suite.rc=rg02_rs01_blc: false;
        jinja2:suite.rc=rg02_rs02_offset: true;
        jinja2:suite.rc=rg02_rs02_blc: false;
        jinja2:suite.rc=rg02_rs03_offset: true;
        jinja2:suite.rc=rg02_rs03_blc: false;

[jinja2:suite.rc=rg02_centre]
ns=jinja2:suite.rc/rg02
sort-key=rg02-c
title=rg02_centre
description=Coordinates of region centre
           =in degrees (lat, lon)
help=Coordinates can be specified either as integers or as real numbers      
    =e.g. 78.0 or 78.242 degrees, but not as 78. since the trailing .        
    =throws up a Jinja2 error at runtime.                                    
    =                                                                        
    =Longitude can be in -180 to 180 or.0 to 360 
type=real,real
fail-if=this(1) < -90.0; # Latitude cannot be less than -90
        this(1) > 90.0; # Latitude cannot exceed 90

[jinja2:suite.rc=rg02_rot_grid]
ns=jinja2:suite.rc/rg02
sort-key=rg02-d
title=rg02_rot_grid
description=Use rotated pole (true)
           =or true lat/lon grid (false).
           =When rg02_use_centre is True
           =rg02_centre will be used as the pole, otherwise
           =rg02_pole will be used.
type=boolean
trigger=jinja2:suite.rc=rg02_pole: true ;

[jinja2:suite.rc=rg02_pole]
ns=jinja2:suite.rc/rg02
sort-key=rg02-e
title=rg02_pole
description=The pole to use for this rotated region.
help=Coordinates can be specified either as integers or as real numbers      
    =e.g. 78.0 or 78.242 degrees, but not as 78. since the trailing .        
    =throws up a Jinja2 error at runtime.                                    
    =                                                                        
    =Longitude convection is 0 to 360 
type=real,real
fail-if=this(1) < -90.0; # Latitude cannot be less than -90
        this(1) > 90.0; # Latitude cannot exceed 90
        this(2) < 0.0; # Longitude cannot be less than 0
        this(2) > 360.0; # Longitude cannot exceed 360

[jinja2:suite.rc=rg02_igbp_offset]
ns=jinja2:suite.rc/rg02
sort-key=rg02-f
title=rg02_igbp_offset
description=NOT USED WHEN CCI_MASK is true 
           =(y,x) in kilometres IGBP land-sea mask offset
help=The IGBP dataset used by the Central Ancillary Program to create
    =the land-sea mask can be offset from truth by different distances in
    =different regions of the globe. This allows the user to offset the
    =land-sea mask generated to correct for this.
type=real,real

[jinja2:suite.rc=rg02_nreslns]
ns=jinja2:suite.rc/rg02
sort-key=rg02-g
title=rg02_nreslns
description=Number of resolutions
help=This defines the number of nested model resolutions for this region.
    =As it is likely that most users will only need a maximum of 3 resolutions,,
    =the GUI and metadata are by default set up to have a maximum of 3 regions, 
    =a maximum of 3 resolutions (per region)
    =
    =To change any of these defaults, go into the bin directory and type 
    ='./setup_metadata 3 3' replacing any of the numbers with your preference. 
    =Note that you will then have to work through the GUI afresh as a new 
    =rose-suite.conf is generated by this command. 
    =
type=integer
range=1:3
trigger=jinja2:suite.rc=rg02_rs01_name: this >= 1;
        jinja2:suite.rc=rg02_rs01_vargrid: this >= 1;
        jinja2:suite.rc=rg02_rs01_blc: this >= 1;
        jinja2:suite.rc=rg02_rs01_3D_ancils: this >= 1;
        jinja2:suite.rc=rg02_rs01_arcl_dust_anc: this >= 1;
        jinja2:suite.rc=rg02_rs01_sstsmc_anc: this >= 1;
        jinja2:suite.rc=rg02_rs01_min_lake_area: this >= 1;
        jinja2:suite.rc=rg02_rs01_mask_overrides: this >= 1;
        jinja2:suite.rc=rg02_rs01_mask_overrides_file: this >= 1;
        jinja2:suite.rc=rg02_rs01_alb_anc: this >= 1;
        jinja2:suite.rc=rg02_rs01_moruses: this >= 1;
        jinja2:suite.rc=rg02_rs01_orog_srtm: this >= 1;
        jinja2:suite.rc=rg02_rs01_srtm_smooth: this >= 1;
        jinja2:suite.rc=rg02_rs01_npts: this >= 1;
        jinja2:suite.rc=rg02_rs01_delta: this >= 1;
        jinja2:suite.rc=rg02_rs01_levset: this >= 1;
        jinja2:suite.rc=rg02_rs01_offset: this >= 1;
        jinja2:suite.rc=rg02_rs01_grid_path: this >= 1;
        jinja2:suite.rc=rg02_rs01_vargrid_path: this >= 1;
        jinja2:suite.rc=rg02_rs02_name: this >= 2;
        jinja2:suite.rc=rg02_rs02_vargrid: this >= 2;
        jinja2:suite.rc=rg02_rs02_blc: this >= 2;
        jinja2:suite.rc=rg02_rs02_3D_ancils: this >= 2;
        jinja2:suite.rc=rg02_rs02_arcl_dust_anc: this >= 2;
        jinja2:suite.rc=rg02_rs02_sstsmc_anc: this >= 2;
        jinja2:suite.rc=rg02_rs02_min_lake_area: this >= 2;
        jinja2:suite.rc=rg02_rs02_mask_overrides: this >= 2;
        jinja2:suite.rc=rg02_rs02_mask_overrides_file: this >= 2;
        jinja2:suite.rc=rg02_rs02_alb_anc: this >= 2;
        jinja2:suite.rc=rg02_rs02_moruses: this >= 2;
        jinja2:suite.rc=rg02_rs02_orog_srtm: this >= 2;
        jinja2:suite.rc=rg02_rs02_srtm_smooth: this >= 2;
        jinja2:suite.rc=rg02_rs02_npts: this >= 2;
        jinja2:suite.rc=rg02_rs02_delta: this >= 2;
        jinja2:suite.rc=rg02_rs02_levset: this >= 2;
        jinja2:suite.rc=rg02_rs02_offset: this >= 2;
        jinja2:suite.rc=rg02_rs02_grid_path: this >= 2;
        jinja2:suite.rc=rg02_rs02_vargrid_path: this >= 2;
        jinja2:suite.rc=rg02_rs03_name: this >= 3;
        jinja2:suite.rc=rg02_rs03_vargrid: this >= 3;
        jinja2:suite.rc=rg02_rs03_blc: this >= 3;
        jinja2:suite.rc=rg02_rs03_3D_ancils: this >= 3;
        jinja2:suite.rc=rg02_rs03_arcl_dust_anc: this >= 3;
        jinja2:suite.rc=rg02_rs03_sstsmc_anc: this >= 3;
